CMD_sites="Returns all sites of the logged-in account."
CMD_chargers="Returns all chargers of the logged-in account."
CMD_site="Returns the site information for the given charger, including circuits."
CMD_config="Returns the stored configuration of the charger."
CMD_circuits="Returns the circuit settings (fuse ratings, dynamic currents) of the site."
CMD_equalizer="Returns the current state of the Easee equalizer."
CMD_state="Returns selected observations (live state values) of the charger."
CMD_latest="Returns the most recently completed charging session."
CMD_ongoing="Returns the currently ongoing charging session."
CMD_start_charging="Starts charging (only effective if authorization is required)."
CMD_stop_charging="Stops charging and revokes the authorization."
CMD_pause_charging="Pauses the ongoing charging session while keeping the authorization."
CMD_resume_charging="Resumes a paused charging session."
CMD_post_dynamicCurrent="Sets the dynamic charging current per phase in ampere with a time to live (TTL)."
CMD_post_dynamicPower="Sets the dynamic charging power in kW and automatically converts to single- or three-phase (incl. hysteresis)."
CMD_post_lock_state="Permanently locks or unlocks the charging cable."
CMD_post_settings="Changes a single charger setting (type and value)."
CMD_reboot="Reboots the charger."
CMD_force_reboot="Forces a reboot of the charger."
CMD_poll_all="Requests the charger to re-send all values."
CMD_poll_lifetimeenergy="Requests the charger to re-send the lifetime energy counter."

