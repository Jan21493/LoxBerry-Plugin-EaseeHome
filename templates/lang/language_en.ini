[RETURN]
HEAD="Data Return"
DESC="Define how the plugin returns the requested values to the Miniserver."
JSON="JSON"
MQTT="MQTT"
MQTT_TOPIC="MQTT Topic"
UDP="UDP"
UDP_PORT="UDP Port"
HINT="MQTT is the recommended method to send values from the Easee plugin to the Miniserver via the MQTT Gateway, because it pushes only changed data to the MS and removes the need for complex parsing of UDP or HTTP inputs in the Miniserver. The LoxBerry MQTT Gateway is used for this. NOTE: In MQTT Gateway V1 you must manually set up a subscription for the topic (with /# at the end). When using version 2, configured virtual inputs can be scanned. Alternatively, values can be sent from the Easee plugin to the Miniserver via UDP. This method requires setting up virtual inputs in the Miniserver and parsing the data via logic blocks, which makes the configuration more complex and error-prone. Using MQTT instead is recommended. JSON outputs the response received from the Easee Cloud API in JSON format. This is handy for testing on the CLI, e.g. with curl or wget."

