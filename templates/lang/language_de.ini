NO_PARAMS="Dieser Befehl benötigt keine weiteren Parameter."
PARAM_ID="Seriennummer der Wallbox (Charger-ID). Für Site-/Circuit-Befehle werden Site- und Circuit-ID automatisch daraus ermittelt."
