PARAM_VALUE="Zielwert des Befehls."
PARAM_HYS1TO3="Optionale Sperrzeit in Sekunden vor dem Wechsel von 1 auf 3 Phasen. 0 = deaktiviert."
PARAM_HYS3TO1="Optionale Sperrzeit in Sekunden vor dem Wechsel von 3 auf 1 Phase. 0 = deaktiviert."
VALUE_DYNCURRENT="Drei Stromwerte in Ampere pro Phase, kommagetrennt (z. B. 16,16,16)."
VALUE_DYNPOWER="Zielleistung in kW (z. B. 4.2). Wird automatisch auf 1- oder 3-phasig umgerechnet."
VALUE_LOCK="Kabelverriegelung: true (dauerhaft verriegelt) oder false (entriegelt, sobald kein Auto verbunden ist)."
VALUE_SETTINGS="Zielwert der unter type gewählten Einstellung."
DOC_LINK="Easee API Dokumentation öffnen"
CMD_sites="Liefert alle Standorte (Sites) des angemeldeten Kontos."
CMD_chargers="Liefert alle Wallboxen (Charger) des angemeldeten Kontos."
CMD_site="Liefert die Site-Informationen zur angegebenen Wallbox inklusive Circuits."
CMD_config="Liefert die gespeicherte Konfiguration der Wallbox."
CMD_circuits="Liefert die Circuit-Einstellungen (Sicherungswerte, dynamische Ströme) des Standorts."
CMD_equalizer="Liefert den aktuellen Zustand des Easee Equalizers."
CMD_state="Liefert ausgewählte Observations (Live-Zustandswerte) der Wallbox."
CMD_latest="Liefert die zuletzt abgeschlossene Ladesitzung."
CMD_ongoing="Liefert die aktuell laufende Ladesitzung."
CMD_start_charging="Startet den Ladevorgang (nur wirksam, wenn Autorisierung erforderlich ist)."
CMD_stop_charging="Stoppt den Ladevorgang und entzieht die Autorisierung."
CMD_pause_charging="Pausiert den laufenden Ladevorgang, die Autorisierung bleibt erhalten."
CMD_resume_charging="Setzt einen pausierten Ladevorgang fort."
CMD_post_dynamicCurrent="Setzt den dynamischen Ladestrom je Phase in Ampere mit Ablaufzeit (TTL)."
CMD_post_dynamicPower="Setzt die dynamische Ladeleistung in kW und rechnet automatisch auf 1- oder 3-phasig um (inkl. Hysterese)."
CMD_post_lock_state="Sperrt oder entsperrt das Ladekabel dauerhaft."
CMD_post_settings="Ändert eine einzelne Einstellung der Wallbox (type und value)."
CMD_reboot="Startet die Wallbox neu."
CMD_force_reboot="Erzwingt einen Neustart der Wallbox."
CMD_poll_all="Fordert die Wallbox auf, alle Werte neu zu senden."
CMD_poll_lifetimeenergy="Fordert die Wallbox auf, den Gesamtenergiezähler neu zu senden."

